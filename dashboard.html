<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Library analytics dashboard and usage telemetry" />
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="app-shell">
    <header class="top-nav">
      <div class="container nav-inner">
        <a href="index.html" class="brand-mark">
          <span class="brand-icon">📚</span>
          <span>Digital Book Library</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Library</a>
          <a href="creator.html">Creator</a>
          <a href="dashboard.html" class="active">Dashboard</a>
          <a href="assistant.html">Assistant</a>
        </nav>
      </div>
    </header>

    <main class="container py-8">
      <section class="page-header glass-card mb-6">
        <div>
          <p class="eyebrow">Insights</p>
          <h1>Reading dashboard</h1>
        </div>
        <div class="status-pill success">Live telemetry</div>
      </section>

      <section class="stats-grid">
        <article class="glass-card metric-card">
          <span class="metric-label">Reading hours</span>
          <strong id="readingHours">0h</strong>
          <small>Updated from IndexedDB</small>
        </article>
        <article class="glass-card metric-card">
          <span class="metric-label">Drafts</span>
          <strong id="draftCount">0</strong>
          <small>Saved in local drafts</small>
        </article>
        <article class="glass-card metric-card">
          <span class="metric-label">Bookmarks</span>
          <strong id="bookmarkCount">0</strong>
          <small>Reader highlights and markers</small>
        </article>
        <article class="glass-card metric-card">
          <span class="metric-label">Chat logs</span>
          <strong id="chatLogCount">0</strong>
          <small>Assistant interactions</small>
        </article>
      </section>

      <section class="analytics-grid mt-6">
        <div class="glass-card chart-card">
          <div class="card-header">
            <h2>Reading activity</h2>
          </div>
          <div id="readingTrendChart" class="mini-chart"></div>
        </div>
        <div class="glass-card chart-card">
          <div class="card-header">
            <h2>Library composition</h2>
          </div>
          <div id="categoryChart" class="mini-chart"></div>
        </div>
      </section>
    </main>

    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
