<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Digital Book Library — Analytics, reading statistics and backup center">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/dashboard.css">
  <title>Digital Book Library — Dashboard</title>
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div>
        <p class="dashboard-kicker">Digital Book Library v2.0</p>
        <h1>Dashboard</h1>
        <p>Analytics, reading progress and data backup center.</p>
      </div>
    </header>

    <section class="dashboard-grid" aria-label="Dashboard statistics">
      <article class="dashboard-card"><h2>Reading Statistics</h2><canvas id="readingChart" width="640" height="280" aria-label="Reading statistics chart"></canvas></article>
      <article class="dashboard-card"><h2>Storage</h2><p id="storageStats">Storage statistics are not available until the V2 storage layer is connected.</p></article>
      <article class="dashboard-card"><h2>Backup</h2><button id="exportBackup" type="button">Export Backup</button><button id="restoreBackup" type="button">Restore Backup</button></article>
    </section>
  </main>

  <script defer src="./assets/js/db.js"></script>
  <script defer src="./assets/js/backup-engine.js"></script>
  <script defer src="./assets/js/dashboard.js"></script>
</body>
</html>
