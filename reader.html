<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Digital Book Library reader"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.telegram.org; worker-src 'self';"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#18202a"><title>Book Reader</title><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/reader.css"><link rel="stylesheet" href="assets/css/bot.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">← লাইব্রেরি</a><div class="reader-tools" aria-label="রিডার নিয়ন্ত্রণ"><button id="fontDecrease" type="button" title="ফন্ট ছোট">A−</button><button id="fontIncrease" type="button" title="ফন্ট বড়">A+</button><button id="fontToggle" type="button">ফন্ট</button><button id="nightToggle" type="button">🌙 নাইট</button><button id="bookmarkButton" type="button">🔖 Bookmark</button><select id="highlightColor" aria-label="Highlight color"><option value="yellow">হলুদ</option><option value="green">সবুজ</option><option value="blue">নীল</option></select><button id="highlightButton" type="button">🖍 Highlight</button><button id="tts-toggle-btn" type="button">🔊 Listen Chapter</button></div></div></header><main class="reader-layout container"><aside class="toc" aria-label="সূচিপত্র"><h2>সূচিপত্র</h2><nav id="tocList"></nav><section class="saved-items"><h2>সংরক্ষিত</h2><div id="savedItems"><p class="status">কোনো আইটেম নেই।</p></div></section></aside><article class="reader-main"><header class="book-header"><p id="bookCategory" class="eyebrow"></p><h1 id="bookTitle">বই লোড হচ্ছে...</h1><p id="bookAuthor"></p></header><p id="readerStatus" class="status" role="status" aria-live="polite"></p><div id="reading-progress-bar" class="reading-progr
