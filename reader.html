<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reader view for the digital book library" />
    <title>Reader View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="app-shell">
    <header class="top-nav">
      <div class="container nav-inner">
        <a href="index.html" class="brand-mark">
          <span class="brand-icon">📚</span>
          <span>Digital Book Library</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Library</a>
          <a href="creator.html">Creator</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="assistant.html">Assistant</a>
        </nav>
      </div>
    </header>

    <main class="container reader-page py-8">
      <section class="reader-shell glass-card">
        <aside class="reader-sidebar glass-panel">
          <div class="sidebar-header">
            <p class="eyebrow">Reader</p>
            <h1>Table of contents</h1>
          </div>
          <ul id="tocList" class="toc-list"></ul>
          <div class="saved-items-wrap">
            <h3>Saved</h3>
            <div id="savedItems" class="saved-items"></div>
          </div>
        </aside>

        <article class="reader-main">
          <div class="reader-toolbar">
            <div class="toolbar-group">
              <button id="previousChapter" type="button">Previous</button>
              <button id="nextChapter" type="button">Next</button>
            </div>
            <div class="toolbar-group">
              <button id="fontDecrease" type="button">A-</button>
              <button id="fontIncrease" type="button">A+</button>
              <button id="bookmarkButton" type="button">Bookmark</button>
            </div>
          </div>

          <div id="readerStatus" class="reader-status">Loading chapter…</div>
          <div id="chapterContent" class="chapter-content"></div>
        </article>
      </section>
    </main>

    <script type="module" src="assets/js/reader.js"></script>
  </body>
</html>
