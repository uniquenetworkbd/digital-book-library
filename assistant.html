<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Assistant Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="app-shell">
    <header class="top-nav">
      <div class="container nav-inner">
        <a href="index.html" class="brand-mark">
          <span class="brand-icon">📚</span>
          <span>Digital Book Library</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Library</a>
          <a href="creator.html">Creator</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="assistant.html" class="active">Assistant</a>
        </nav>
      </div>
    </header>

    <main class="container py-8">
      <section class="assistant-layout glass-card">
        <div class="assistant-sidebar">
          <div class="sidebar-header">
            <p class="eyebrow">61-bot system</p>
            <h1>Assistant Console</h1>
          </div>
          <div class="bot-list">
            <div class="bot-pill online">BOT-01 → BOT-30</div>
            <div class="bot-pill online">BOT-31 → BOT-60</div>
            <div class="bot-pill online">BOT-61</div>
          </div>
          <div class="assistant-status">
            <span class="live-dot"></span>
            System online
          </div>
        </div>

        <div class="assistant-chat-panel">
          <div class="chat-header">
            <div>
              <p class="eyebrow">Conversation</p>
              <h2>Master assistant</h2>
            </div>
            <button id="clearChat" class="secondary-btn small">Clear</button>
          </div>

          <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" placeholder="Ask about books, stats, or help..." autocomplete="off" />
            <button type="submit" class="primary-btn">Send</button>
          </form>
        </div>
      </section>
    </main>

    <script src="assets/js/bot-engine-part1.js"></script>
    <script src="assets/js/bot-engine-part2.js"></script>
    <script src="assets/js/complete-bot-engine.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const clearChat = document.getElementById('clearChat');
        const engine = window.MasterBotEngine ? new window.MasterBotEngine() : (window.completeBotEngine || null);

        const appendMessage = (role, text) => {
          const item = document.createElement('div');
          item.className = `chat-message ${role}`;
          item.textContent = text;
          chatMessages.appendChild(item);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        appendMessage('assistant', 'Hello! I can help you discover books, check reading stats, and explain library commands. Try /help or ask “hello”.');

        clearChat?.addEventListener('click', () => {
          chatMessages.innerHTML = '';
          appendMessage('assistant', 'Chat cleared. Ready for a new request.');
        });

        chatForm?.addEventListener('submit', async (event) => {
          event.preventDefault();
          const rawValue = chatInput.value.trim();
          if (!rawValue) return;
          appendMessage('user', rawValue);
          chatInput.value = '';

          let response = 'I can help with discovery, stats, and reading flow.';
          if (engine && typeof engine.handleInput === 'function') {
            const result = await engine.handleInput(rawValue, { source: 'assistant.html' });
            response = result && result.message ? result.message : response;
          } else {
            response = rawValue.toLowerCase().includes('hello') || rawValue.toLowerCase().includes('hi')
              ? 'Hello! I’m your digital library assistant. How can I help today?'
              : response;
          }

          appendMessage('assistant', response);
        });
      });
    </script>
  </body>
</html>
