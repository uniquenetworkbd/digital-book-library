<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101b1c"><title>Assistant | Open Shelf</title><link rel="stylesheet" href="assets/css/main.css"><script src="assets/js/complete-bot-engine.js"></script></head>
<body>
  <header class="top-nav"><nav class="container nav-inner" aria-label="Main navigation"><a class="brand-mark" href="index.html"><span class="brand-icon" aria-hidden="true">OS</span><span>Open Shelf</span></a><div class="nav-links"><a href="index.html">Library</a><a href="creator.html">Creator</a><a href="reader.html">Reader</a><a href="dashboard.html">Dashboard</a><a class="active" aria-current="page" href="assistant.html">Assistant</a></div></nav></header>
  <main class="container page"><section class="page-heading"><div><p class="kicker">Local reading companion</p><h1>Ask the library.</h1><p>Search your collection, check local activity, or run a named bot.</p></div><span class="assistant-status"><span class="live-dot" aria-hidden="true"></span>61 bots available</span></section>
    <section class="panel assistant-shell"><aside class="assistant-rail"><p class="kicker">Bot network</p><h2>One local orchestrator</h2><p class="muted">Try a direct command like <code>/search history</code> or <code>/bot-61</code>.</p><div id="bot-grid" class="bot-grid" aria-label="Bot IDs"></div></aside><div class="chat-area"><div id="chat-feed" class="chat-feed" aria-live="polite" aria-label="Conversation"></div><form id="chat-form" class="chat-composer"><label class="sr-only" for="chat-input">Message the assistant</label><input id="chat-input" autocomplete="off" maxlength="500" placeholder="Ask something or enter a command…"><button class="primary-btn" type="submit" aria-label="Send message">Send</button></form></div></section>
  </main>
  <script>
    (() => {
      const engine = window.completeBotEngine;
      const feed = document.querySelector('#chat-feed');
      const form = document.querySelector('#chat-form');
      const input = document.querySelector('#chat-input');
      const historyKey = 'dbl:assistant-history';
      function append(role, text) { const bubble = document.createElement('div'); bubble.className = `chat-bubble ${role}`; bubble.textContent = text; feed.append(bubble); feed.scrollTop = feed.scrollHeight; }
      let history = [];
      try { history = JSON.parse(localStorage.getItem(historyKey) || '[]'); } catch (_) {}
      if (Array.isArray(history)) history.slice(-30).forEach((item) => append(item.role, item.text)); else history = [];
      if (!feed.children.length) append('assistant', 'Hello. I can search your library, check reading activity, or route a request to any of the 61 local bots.');
      document.querySelector('#bot-grid').innerHTML = Array.from({ length: 61 }, (_, index) => `<span>BOT-${String(index + 1).padStart(2, '0')}</span>`).join('');
      form.addEventListener('submit', async (event) => {
        event.preventDefault(); const text = input.value.trim(); if (!text) return;
        input.value = ''; append('user', text); history.push({ role: 'user', text, at: Date.now() });
        const reply = await engine.processQuery(text); if (reply) { const response = typeof reply === 'string' ? reply : reply.message; append('assistant', response); history.push({ role: 'assistant', text: response, at: Date.now() }); }
        history = history.slice(-60); try { localStorage.setItem(historyKey, JSON.stringify(history)); } catch (_) {}
      });
    })();
  </script>
</body>
</html>
