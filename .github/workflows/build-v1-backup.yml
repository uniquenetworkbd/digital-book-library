name: Create V1 Baseline ZIP

on:
  push:
    paths:
      - '.github/workflows/build-v1-backup.yml'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact V1 baseline ZIP
        run: |
          git archive --format=zip --prefix=digital-book-library-v1/ b836760c9e372f9003eda643a7d4b1994f07bf44 -o digital-book-library-v1-baseline-b836760.zip
          sha256sum digital-book-library-v1-baseline-b836760.zip
      - name: Commit ZIP and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital-book-library-v1-baseline-b836760.zip
          git rm .github/workflows/build-v1-backup.yml
          git commit -m "Add V1 baseline ZIP backup"
          git push
