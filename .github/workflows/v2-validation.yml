name: Digital Book Library V2 Validation & v2.1 CI Check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install v2.1 tooling
        run: npm install --no-audit --no-fund
      - name: ESLint code quality check
        run: npm run lint
      - name: Syntax check JavaScript
        run: |
          for f in assets/js/*.js tests/*.mjs; do node --check "$f"; done
      - name: V2 integration contract
        run: node tests/v2-validation.mjs
      - name: IndexedDB schema safety audit
        run: npm run test:db-schema
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/dbl-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/index.html >/dev/null && break; sleep 1; done
      - name: Run Playwright E2E
        run: npm run test:e2e
  performance-audit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 >/tmp/dbl-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/index.html >/dev/null && break; sleep 1; done
      - name: Run Lighthouse CI Audit
        run: npm run test:performance
