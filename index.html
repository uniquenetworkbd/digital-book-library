<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Digital Book Library — browse, search and read books.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18202a">
  <title>Digital Book Library</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/bot.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">📚 Digital Book Library</a>
      <nav aria-label="প্রধান নেভিগেশন">
        <a href="index.html">লাইব্রেরি</a>
        <a href="creator.html">বই লিখুন</a>
        <a href="dashboard.html">ড্যাশবোর্ড</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">Client-side Digital Library</p>
      <h1>আপনার বইয়ের লাইব্রেরি</h1>
      <p>বই খুঁজুন, ক্যাটাগরি/ট্যাগ দিয়ে ফিল্টার করুন এবং উন্নত ক্রমে সাজিয়ে ব্রাউজারেই পড়ুন।</p>
    </section>
    <section class="library-controls" aria-label="লাইব্রেরি নিয়ন্ত্রণ">
      <label class="search-field">🔎
        <span class="sr-only">বই, লেখক বা ট্যাগ খুঁজুন</span>
        <input id="searchInput" type="search" placeholder="বইয়ের নাম, লেখক বা ট্যাগ..." autocomplete="off">
      </label>
      <label><span class="sr-only">ক্যাটাগরি</span><select id="categoryFilter"><option value="all">সব ক্যাটাগরি</option><option value="Literature">Literature</option><option value="Technical">Technical</option><option value="Novel">Novel</option><option value="Research">Research</option></select></label>
      <label><span class="sr-only">অতিরিক্ত ট্যাগ</span><input id="tagFilter" type="search" placeholder="ট্যাগ: ai, research..." autocomplete="off"></label>
      <label><span class="sr-only">সাজানোর ক্রম</span><select id="sortFilter"><option value="title-asc">শিরোনাম: A→Z</option><option value="title-desc">শিরোনাম: Z→A</option><option value="date-desc">প্রকাশকাল: নতুন→পুরনো</option><option value="date-asc">প্রকাশকাল: পুরনো→নতুন</option><option value="rating-desc">রেটিং: বেশি→কম</option><option value="readingTime-asc">পড়ার সময়: কম→বেশি</option></select></label>
    </section>
    <p id="catalogStatus" class="status" role="status">ক্যাটালগ লোড হচ্ছে...</p>
    <section id="bookGrid" class="book-grid" aria-live="polite"></section>
  </main>
  <footer class="site-footer"><div class="container">GitHub Pages • Vanilla JavaScript • JSON • IndexedDB</div></footer>
  <script src="assets/js/ui-enhancements.js"></script>
  <script src="assets/js/ai-engine.js"></script>
  <script src="assets/js/tts-engine.js"></script>
  <script src="assets/js/backup-engine.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
